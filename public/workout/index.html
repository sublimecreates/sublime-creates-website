<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IronWeek">
<title>IronWeek</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');
:root{--bg:#0a0a0a;--surface:#141414;--surface2:#1e1e1e;--surface3:#2a2a2a;--accent:#e8ff47;--text:#f0f0f0;--text2:#888;--text3:#555;--radius:16px;--safe-bottom:env(safe-area-inset-bottom,20px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* LOGIN */
#login-screen{position:fixed;inset:0;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;padding:32px 24px}
.logo-icon{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#1a2200,#2d3d00);border:2px solid #3a5000;display:flex;align-items:center;justify-content:center;margin-bottom:20px;font-size:34px}
.login-title{font-family:'Bebas Neue',Impact,sans-serif;font-size:52px;letter-spacing:4px;color:#e8ff47;line-height:1;margin-bottom:6px}
.login-sub{font-size:13px;color:#666;letter-spacing:2px;text-transform:uppercase;margin-bottom:48px}
.login-wrap{width:100%;max-width:340px}
.pass-input{width:100%;background:#141414;border:1.5px solid #222;border-radius:14px;padding:16px 20px;color:#f0f0f0;font-family:inherit;font-size:18px;letter-spacing:4px;outline:none;transition:border-color .2s;text-align:center;-webkit-appearance:none;margin-bottom:12px}
.pass-input:focus{border-color:#e8ff47}
.pass-input.err{border-color:#ff4444;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.login-btn{width:100%;padding:16px;border-radius:14px;border:none;background:#e8ff47;color:#0a0a0a;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;transition:all .15s}
.login-btn:active{transform:scale(.98)}
.login-err{font-size:13px;color:#ff5555;margin-top:10px;text-align:center;min-height:18px}

/* APP */
#app-screen{display:none}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(14,14,14,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid #222;display:flex;padding:10px 0 calc(10px + var(--safe-bottom));z-index:100}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;color:var(--text3);font-family:inherit;font-size:10px;font-weight:500;cursor:pointer;transition:color .2s;padding:4px 0}
.nav-btn.active{color:var(--accent)}
.nav-btn svg{width:22px;height:22px}
.screen{display:none;padding:0 0 calc(80px + var(--safe-bottom));min-height:100dvh}
.screen.active{display:block}
.app-header{padding:56px 20px 16px;display:flex;align-items:flex-end;justify-content:space-between}
.app-title{font-family:'Bebas Neue',Impact,sans-serif;font-size:42px;letter-spacing:2px;color:var(--accent);line-height:1}
.header-sub{font-size:13px;color:var(--text2);margin-top:2px}
.section-label{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text3);padding:0 16px 8px;margin-top:8px}
.card{background:var(--surface);border-radius:var(--radius);padding:16px;margin:0 16px 12px}

/* WEEK */
.day-card{background:var(--surface);border-radius:var(--radius);margin:0 16px 10px;overflow:hidden;border:1px solid #1f1f1f}
.day-card.has-workout{border-color:#2a2a2a}
.day-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;-webkit-user-select:none;user-select:none}
.day-label{display:flex;align-items:center;gap:12px}
.day-dot{width:8px;height:8px;border-radius:50%;background:var(--text3)}
.day-dot.today{background:var(--accent)}
.day-name{font-family:'Bebas Neue',Impact,sans-serif;font-size:22px;letter-spacing:1px}
.day-meta{font-size:12px;color:var(--text2);margin-top:1px}
.day-chevron{color:var(--text3);transition:transform .2s;flex-shrink:0}
.day-card.open .day-chevron{transform:rotate(180deg)}
.day-content{display:none;padding:0 16px 14px;border-top:1px solid #1f1f1f}
.day-card.open .day-content{display:block}
.day-ex-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #1e1e1e}
.day-ex-item:last-child{border-bottom:none}
.mini-anim{width:36px;height:36px;border-radius:8px;background:var(--surface3);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;position:relative}
.day-ex-info{flex:1}
.day-ex-name{font-size:14px;font-weight:500}
.day-ex-sets{font-size:12px;color:var(--text2);margin-top:1px}
.rm-btn{background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;padding:4px;line-height:1}
.day-actions{display:flex;gap:8px;margin-top:10px}
.btn-sm{flex:1;padding:10px;border-radius:10px;border:none;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-accent{background:var(--accent);color:#0a0a0a}
.btn-accent:active{transform:scale(.97)}
.btn-ghost{background:var(--surface3);color:var(--text2)}
.btn-ghost:active{transform:scale(.97)}
.btn-danger{background:#2a1212;color:#ff5555}
.rest-badge{text-align:center;padding:10px;color:var(--text3);font-size:13px;font-style:italic}
.today-banner{margin:0 16px 12px;background:linear-gradient(135deg,#1a1f00,#252e00);border:1px solid #3a4a00;border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.today-label{font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:1px}
.today-name{font-family:'Bebas Neue',Impact,sans-serif;font-size:20px;color:var(--accent);letter-spacing:1px;margin-top:2px}
.start-btn{background:var(--accent);color:#0a0a0a;border:none;border-radius:10px;padding:10px 16px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}

/* LIBRARY */
.search-wrap{margin:0 16px 12px;position:relative}
.search-wrap input{width:100%;background:var(--surface);border:1px solid #222;border-radius:12px;padding:12px 16px 12px 42px;color:var(--text);font-family:inherit;font-size:15px;outline:none;transition:border-color .2s}
.search-wrap input:focus{border-color:var(--accent)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.chips{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 14px;border-radius:20px;border:1px solid #333;background:var(--surface);color:var(--text2);font-family:inherit;font-size:13px;cursor:pointer;transition:all .15s;flex-shrink:0}
.chip.active{background:var(--accent);color:#0a0a0a;border-color:var(--accent);font-weight:600}
.ex-list{padding:0 16px}
.ex-card{background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:14px;border:1px solid #1f1f1f;transition:border-color .2s,transform .15s;-webkit-user-select:none;user-select:none}
.ex-card:active{transform:scale(.98);border-color:var(--accent)}
.anim-box{width:64px;height:64px;border-radius:12px;background:var(--surface2);flex-shrink:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.ex-info{flex:1}
.ex-name{font-size:15px;font-weight:600;line-height:1.2}
.ex-tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--surface3);color:var(--text2);font-weight:500}
.tag.m{background:#1a1a2e;color:#8888ff}
.tag.e{background:#1a2a1a;color:#66cc66}
.add-btn{width:32px;height:32px;border-radius:50%;background:var(--accent);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform .15s;font-size:20px;color:#0a0a0a;font-weight:700;line-height:1}
.add-btn:active{transform:scale(.9)}
.empty-state{text-align:center;padding:60px 32px;color:var(--text3)}
.empty-icon{font-size:48px;margin-bottom:16px}
.empty-title{font-family:'Bebas Neue',Impact,sans-serif;font-size:28px;color:var(--text2);margin-bottom:8px}
.empty-desc{font-size:14px;line-height:1.6}

/* PLANS */
.new-plan-btn{width:calc(100% - 32px);margin:0 16px 16px;padding:16px;border-radius:var(--radius);border:2px dashed #333;background:none;color:var(--text2);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.new-plan-btn:active{border-color:var(--accent);color:var(--accent)}
.plan-card{background:var(--surface);border-radius:var(--radius);padding:16px;margin:0 16px 12px;border:1px solid #1f1f1f;cursor:pointer;transition:border-color .2s}
.plan-card:active{border-color:var(--accent)}
.plan-card-top{display:flex;justify-content:space-between;align-items:flex-start}
.plan-name{font-family:'Bebas Neue',Impact,sans-serif;font-size:24px;letter-spacing:1px}
.plan-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;padding:0}
.plan-dots{display:flex;gap:6px;margin-top:10px}
.plan-dot{width:28px;height:28px;border-radius:50%;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--text3)}
.plan-dot.on{background:var(--accent);color:#0a0a0a}
.plan-stats{font-size:12px;color:var(--text2);margin-top:8px}

/* MODALS */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(4px);z-index:200;align-items:flex-end}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:24px 24px 0 0;padding:20px 20px calc(20px + var(--safe-bottom));width:100%;max-height:90dvh;overflow-y:auto;animation:slideUp .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:4px;border-radius:2px;background:#444;margin:0 auto 20px}
.modal-title{font-family:'Bebas Neue',Impact,sans-serif;font-size:28px;letter-spacing:1px;margin-bottom:16px}
.modal-input{width:100%;background:var(--surface2);border:1px solid #333;border-radius:12px;padding:14px 16px;color:var(--text);font-family:inherit;font-size:16px;outline:none;margin-bottom:12px;transition:border-color .2s;-webkit-appearance:none}
.modal-input:focus{border-color:var(--accent)}
.modal-btn{width:100%;padding:16px;border-radius:12px;border:none;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px;transition:all .15s}
.modal-btn.p{background:var(--accent);color:#0a0a0a}
.modal-btn.p:active{transform:scale(.98)}
.modal-btn.s{background:var(--surface3);color:var(--text2)}
.sets-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.sets-row label{font-size:11px;color:var(--text2);display:block;margin-bottom:4px}
.day-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.modal-subtitle{font-size:13px;color:var(--text3);margin-bottom:8px;font-weight:600}
.ex-detail-anim{width:120px;height:120px;border-radius:20px;background:var(--surface2);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.ex-detail-name{font-family:'Bebas Neue',Impact,sans-serif;font-size:32px;letter-spacing:1px;text-align:center;margin-bottom:6px}
.ex-detail-desc{font-size:14px;color:var(--text2);text-align:center;line-height:1.6;margin-bottom:16px}
.muscle-tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:20px}

/* PLAYER */
.player-anim{width:160px;height:160px;border-radius:24px;background:var(--surface2);margin:0 auto 20px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.player-ex-name{font-family:'Bebas Neue',Impact,sans-serif;font-size:36px;letter-spacing:1px;text-align:center;margin-bottom:4px}
.player-info{font-size:18px;color:var(--text2);text-align:center}
.set-circles{display:flex;gap:8px;justify-content:center;margin:20px 0}
.set-circle{width:40px;height:40px;border-radius:50%;border:2px solid #333;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--text3);transition:all .2s}
.set-circle.done{background:var(--accent);border-color:var(--accent);color:#0a0a0a}
.set-circle.cur{border-color:var(--accent);color:var(--accent)}
.timer-num{font-family:'Bebas Neue',Impact,sans-serif;font-size:64px;letter-spacing:4px;text-align:center;color:var(--accent);margin:10px 0}
.timer-lbl{text-align:center;font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:2px;margin-bottom:20px}
.prog-wrap{background:var(--surface3);border-radius:4px;height:4px;margin:0 0 16px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .4s}
.player-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}

/* ANIMATIONS */
@keyframes pu-body{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes pu-arm{0%,100%{transform-origin:top;transform:rotate(40deg)}50%{transform-origin:top;transform:rotate(70deg)}}
@keyframes sq-body{0%,100%{transform:translateY(0)}50%{transform:translateY(12px) scaleY(.85)}}
@keyframes sq-leg{0%,100%{transform-origin:top;transform:rotate(10deg)}50%{transform-origin:top;transform:rotate(55deg)}}
@keyframes cu-arm{0%,100%{transform-origin:top;transform:rotate(20deg)}50%{transform-origin:top;transform:rotate(-40deg)}}
@keyframes ru-body{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes ru-leg1{0%,100%{transform-origin:top;transform:rotate(-30deg)}50%{transform-origin:top;transform:rotate(50deg)}}
@keyframes ru-leg2{0%,100%{transform-origin:top;transform:rotate(50deg)}50%{transform-origin:top;transform:rotate(-30deg)}}
@keyframes ro-body{0%,100%{transform:translateX(0)}50%{transform:translateX(-6px)}}
@keyframes ro-arm{0%,100%{transform-origin:top;transform:rotate(60deg)}50%{transform-origin:top;transform:rotate(10deg)}}
@keyframes pr-arm{0%,100%{transform-origin:top;transform:rotate(80deg)}50%{transform-origin:top;transform:rotate(10deg)}}
@keyframes pl-pulse{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.02)}}
@keyframes dl-body{0%,100%{transform:rotate(0deg) translateY(0)}50%{transform:rotate(-35deg) translateY(8px)}}
@keyframes ln-body{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes ln-leg1{0%,100%{transform-origin:top;transform:rotate(0deg)}50%{transform-origin:top;transform:rotate(40deg)}}
@keyframes ln-leg2{0%,100%{transform-origin:top;transform:rotate(0deg)}50%{transform-origin:top;transform:rotate(-60deg)}}
@keyframes pu2-body{0%,100%{transform:translateY(6px)}50%{transform:translateY(-4px)}}
@keyframes dp-body{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
@keyframes cr-upper{0%,100%{transform-origin:bottom;transform:rotate(0deg)}50%{transform-origin:bottom;transform:rotate(-35deg)}}
@keyframes jp-body{0%,40%{transform:translateY(0)}60%{transform:translateY(-14px)}80%,100%{transform:translateY(0)}}
@keyframes la-arm{0%,100%{transform-origin:top center;transform:rotate(0deg)}50%{transform-origin:top center;transform:rotate(80deg)}}
@keyframes fl-arm{0%,100%{transform-origin:top;transform:rotate(70deg)}50%{transform-origin:top;transform:rotate(10deg)}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="logo-icon">🏋️</div>
  <div class="login-title">IRONWEEK</div>
  <div class="login-sub">Personal Training</div>
  <div class="login-wrap">
    <input type="password" class="pass-input" id="pass-input" placeholder="Enter password" maxlength="30" autocomplete="current-password">
    <button class="login-btn" id="login-btn">ENTER →</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app-screen">

  <!-- WEEK SCREEN -->
  <div id="screen-week" class="screen active">
    <div class="app-header">
      <div><div class="app-title">IRONWEEK</div><div class="header-sub">Your weekly plan</div></div>
      <div id="active-badge" style="font-size:12px;color:var(--text2);text-align:right"></div>
    </div>
    <div id="today-banner"></div>
    <div class="section-label">THIS WEEK</div>
    <div id="week-grid"></div>
  </div>

  <!-- LIBRARY SCREEN -->
  <div id="screen-library" class="screen">
    <div class="app-header">
      <div><div class="app-title">EXERCISES</div><div class="header-sub">Tap + to add to your week</div></div>
    </div>
    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="search" id="lib-search" placeholder="Search exercises…">
    </div>
    <div class="chips" id="muscle-chips"></div>
    <div class="ex-list" id="ex-list"></div>
  </div>

  <!-- PLANS SCREEN -->
  <div id="screen-plans" class="screen">
    <div class="app-header">
      <div><div class="app-title">MY PLANS</div><div class="header-sub" id="plans-sub"></div></div>
    </div>
    <button class="new-plan-btn" id="new-plan-btn">＋ Create New Plan</button>
    <div id="plans-list"></div>
  </div>

  <!-- NAV -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-week" data-screen="week">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Week
    </button>
    <button class="nav-btn" id="nav-library" data-screen="library">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M4 6h16M4 10h16M4 14h8"/><circle cx="17" cy="17" r="3"/><path d="m19.5 19.5 1.5 1.5"/></svg>
      Library
    </button>
    <button class="nav-btn" id="nav-plans" data-screen="plans">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Plans
    </button>
  </nav>
</div>

<!-- MODAL: Add to Day -->
<div class="overlay" id="modal-add">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-add-title">Add Exercise</div>
    <div id="modal-add-anim" style="width:80px;height:80px;border-radius:16px;background:var(--surface2);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden"></div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:16px;text-align:center" id="modal-add-muscles"></div>
    <div class="modal-subtitle">ADD TO DAY</div>
    <div class="day-chips" id="day-chips"></div>
    <div class="modal-subtitle">SETS & REPS</div>
    <div class="sets-row">
      <div><label>Sets</label><input type="number" class="modal-input" id="inp-sets" value="3" min="1" max="20" style="margin:0;text-align:center"></div>
      <div><label>Reps</label><input type="number" class="modal-input" id="inp-reps" value="10" min="1" max="100" style="margin:0;text-align:center"></div>
      <div><label>Rest (s)</label><input type="number" class="modal-input" id="inp-rest" value="60" min="0" max="300" step="15" style="margin:0;text-align:center"></div>
    </div>
    <button class="modal-btn p" id="confirm-add-btn">Add Exercise</button>
    <button class="modal-btn s" onclick="closeModal('modal-add')">Cancel</button>
  </div>
</div>

<!-- MODAL: Exercise Detail -->
<div class="overlay" id="modal-detail">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="ex-detail-anim" id="detail-anim"></div>
    <div class="ex-detail-name" id="detail-name"></div>
    <div class="ex-detail-desc" id="detail-desc"></div>
    <div class="muscle-tags" id="detail-muscles"></div>
    <button class="modal-btn p" id="detail-add-btn">Add to Plan</button>
    <button class="modal-btn s" onclick="closeModal('modal-detail')">Close</button>
  </div>
</div>

<!-- MODAL: New Plan -->
<div class="overlay" id="modal-newplan">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">NEW PLAN</div>
    <input type="text" class="modal-input" id="new-plan-name" placeholder="e.g. Push Pull Legs" maxlength="30">
    <button class="modal-btn p" id="create-plan-btn">Create Plan</button>
    <button class="modal-btn s" onclick="closeModal('modal-newplan')">Cancel</button>
  </div>
</div>

<!-- MODAL: Workout Player -->

(function(){
  if(sessionStorage.getItem('iw_auth')==='1'){boot();return;}
  const inp=document.getElementById('pass-input');
  const btn=document.getElementById('login-btn');
  const err=document.getElementById('login-err');
  function tryLogin(){
    if(inp.value===PASSWORD){
      sessionStorage.setItem('iw_auth','1');
      boot();
    } else {
      err.textContent='Incorrect password.';
      inp.classList.add('err');
      setTimeout(()=>{inp.classList.remove('err');inp.value='';},500);
    }
  }
  btn.addEventListener('click',tryLogin);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin();});
  setTimeout(()=>inp.focus(),200);
})();

function boot(){
  document.getElementById('login-screen').style.display='none';

  fly:<g><circle cx="32" cy="14" r="6" fill="none" stroke="#e8ff47" stroke-width="2.5"/><line x1="32" y1="20" x2="32" y2="36" stroke="#e8ff47" stroke-width="3" stroke-linecap="round"/><g style="animation:fl-arm 1.2s ease-in-out infinite;transform-origin:30px 26px"><line x1="30" y1="26" x2="10" y2="34" stroke="#e8ff47" stroke-width="2.5" stroke-linecap="round"/></g><g style="animation:fl-arm 1.2s ease-in-out infinite reverse;transform-origin:34px 26px"><line x1="34" y1="26" x2="54" y2="34" stroke="#e8ff47" stroke-width="2.5" stroke-linecap="round"/></g><line x1="30" y1="36" x2="26" y2="52" stroke="#e8ff47" stroke-width="2.5" stroke-linecap="round"/><line x1="34" y1="36" x2="38" y2="52" stroke="#e8ff47" stroke-width="2.5" stroke-linecap="round"/></g>`;
  const parts=t.split('\n').map(l=>l.trim()).filter(l=>l);
  const map={};
  parts.forEach(p=>{const i=p.indexOf(':');if(i>0){map[p.slice(0,i)]=p.slice(i+1);}});
  const inner=map[type]||map['jump'];
  return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
}

// ── APP INIT ─────────────────────────────────────────────
function initApp(){
  loadS();
  // Nav
  document.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.addEventListener('click',()=>showScreen(btn.dataset.screen));
  });
  // Library search
  document.getElementById('lib-search').addEventListener('input',filterLib);
  // New plan button
  document.getElementById('new-plan-btn').addEventListener('click',()=>{
    document.getElementById('new-plan-name').value='';
    openModal('modal-newplan');
  });
  document.getElementById('create-plan-btn').addEventListener('click',createPlan);
  document.getElementById('confirm-add-btn').addEventListener('click',confirmAdd);
  document.getElementById('player-next').addEventListener('click',playerNext);
  document.getElementById('player-prev').addEventListener('click',playerPrev);
  document.getElementById('player-exit').addEventListener('click',()=>closeModal('modal-player'));
  // Close modals on overlay click
  document.querySelectorAll('.overlay').forEach(o=>{
    o.addEventListener('click',e=>{if(e.target===o)closeModal(o.id);});
  });
  renderWeek();
  renderLib();
  renderPlans();
  updateBadge();
}

// ── NAVIGATION ───────────────────────────────────────────
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.getElementById('nav-'+name).classList.add('active');
}

// ── WEEK SCREEN ───────────────────────────────────────────
function getTodayKey(){
  const d=new Date().getDay();
  return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d];
}
function renderWeek(){
  const todayKey=getTodayKey();
  const banner=document.getElementById('today-banner');
  const grid=document.getElementById('week-grid');
  banner.innerHTML='';
  grid.innerHTML='';
  // Today banner
  const tw=S.weekPlan[todayKey];
  if(tw&&tw.exercises.length){
    banner.innerHTML=`<div class="today-banner">
      <div>
        <div class="today-label">Today · ${WLABELS[todayKey]}</div>
        <div class="today-name">${tw.name||'Workout'}</div>
        <div style="font-size:12px;color:var(--text2);margin-top:2px">${tw.exercises.length} exercise${tw.exercises.length!==1?'s':''}</div>
      </div>
      <button class="start-btn" onclick="startWorkout('${todayKey}')">▶ START</button>
    </div>`;
  }
  WKEYS.forEach(key=>{
    const w=S.weekPlan[key];
    const isToday=key===todayKey;
    const div=document.createElement('div');
    div.className='day-card'+(w?' has-workout':'');
    div.id='dc-'+key;
    let exHTML='';
    if(w&&w.exercises.length){
      exHTML=w.exercises.map((ex,i)=>{
        const e=EX.find(x=>x.id===ex.exId);
        return `<div class="day-ex-item">
          <div class="mini-anim">${svg(e?.anim||'jump',36)}</div>
          <div class="day-ex-info">
            <div class="day-ex-name">${e?.name||ex.exId}</div>
            <div class="day-ex-sets">${ex.sets} sets × ${ex.reps} reps · ${ex.rest}s rest</div>
          </div>
          <button class="rm-btn" onclick="rmEx('${key}',${i})">×</button>
        </div>`;
      }).join('');
    } else if(w){
      exHTML='<div style="color:var(--text3);font-size:13px;padding:8px 0">No exercises yet — add some!</div>';
    }
    let actionsHTML=w
      ?`<div class="day-actions">
          <button class="btn-sm btn-accent" onclick="goAddEx('${key}')">+ Exercise</button>
          ${w.exercises.length?`<button class="btn-sm btn-ghost" onclick="startWorkout('${key}')">▶ Start</button>`:''}
          <button class="btn-sm btn-danger" onclick="clearDay('${key}')">Clear</button>
        </div>`
      :`<div style="padding-top:8px"><button class="btn-sm btn-accent" style="width:100%" onclick="goAddEx('${key}')">+ Add Workout</button></div>`;
    div.innerHTML=`
      <div class="day-header" onclick="toggleDay('${key}')">
        <div class="day-label">
          <div class="day-dot ${isToday?'today':''}"></div>
          <div>
            <div class="day-name">${WLABELS[key]}</div>
            <div class="day-meta">${w?(w.name||'Workout')+' · '+w.exercises.length+' exercises':'Rest Day'}</div>
          </div>
        </div>
        <svg class="day-chevron" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="day-content">
        ${w?`<div>${exHTML}</div>${actionsHTML}`:`<div class="rest-badge">😴 Rest & Recover</div>${actionsHTML}`}
      </div>`;
    grid.appendChild(div);
  });
}
function toggleDay(key){document.getElementById('dc-'+key).classList.toggle('open');}
function clearDay(key){if(confirm('Remove all exercises from '+WLABELS[key]+'?')){S.weekPlan[key]=null;saveS();renderWeek();}}
function rmEx(key,idx){
  S.weekPlan[key].exercises.splice(idx,1);
  saveS();renderWeek();
  setTimeout(()=>{const c=document.getElementById('dc-'+key);if(c)c.classList.add('open');},50);
}
function goAddEx(key){
  _targetDay=key;
  showScreen('library');
}

// ── LIBRARY SCREEN ────────────────────────────────────────
let _activeFilter='All';
let _pendingEx=null;
let _pendingDay=null;
let _targetDay=null;

function renderLib(){
  const chips=document.getElementById('muscle-chips');
  chips.innerHTML=MUSCLES.map(m=>`<div class="chip${m===_activeFilter?' active':''}" onclick="setFilter('${m}')">${m}</div>`).join('');
  filterLib();
}
function setFilter(m){_activeFilter=m;renderLib();}
function filterLib(){
  const q=document.getElementById('lib-search').value.toLowerCase();
  const filtered=EX.filter(e=>{
    const mok=_activeFilter==='All'||e.muscle===_activeFilter;
    const sok=!q||e.name.toLowerCase().includes(q)||e.muscle.toLowerCase().includes(q)||e.equipment.toLowerCase().includes(q);
    return mok&&sok;
  });
  const list=document.getElementById('ex-list');
  if(!filtered.length){
    list.innerHTML='<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">Nothing Found</div><div class="empty-desc">Try a different search or filter.</div></div>';
    return;
  }
  list.innerHTML=filtered.map(e=>`
    <div class="ex-card" onclick="openDetail('${e.id}')">
      <div class="anim-box">${svg(e.anim,64)}</div>
      <div class="ex-info">
        <div class="ex-name">${e.name}</div>
        <div class="ex-tags"><span class="tag m">${e.muscle}</span><span class="tag e">${e.equipment}</span></div>
      </div>
      <button class="add-btn" onclick="event.stopPropagation();openAdd('${e.id}')">+</button>
    </div>`).join('');
}

// ── EXERCISE DETAIL ───────────────────────────────────────
function openDetail(id){
  const e=EX.find(x=>x.id===id);if(!e)return;
  document.getElementById('detail-anim').innerHTML=svg(e.anim,120);
  document.getElementById('detail-name').textContent=e.name;
  document.getElementById('detail-desc').textContent=e.desc;
  document.getElementById('detail-muscles').innerHTML=e.muscles.map(m=>`<span class="tag m">${m}</span>`).join('');
  document.getElementById('detail-add-btn').onclick=()=>{closeModal('modal-detail');openAdd(id);};
  openModal('modal-detail');
}

// ── ADD TO DAY MODAL ──────────────────────────────────────
function openAdd(id){
  _pendingEx=id;
  const e=EX.find(x=>x.id===id);
  document.getElementById('modal-add-title').textContent='Add: '+e.name;
  document.getElementById('modal-add-anim').innerHTML=svg(e.anim,80);
  document.getElementById('modal-add-muscles').textContent=e.muscles.join(' · ');
  // Day chips
  document.getElementById('day-chips').innerHTML=WKEYS.map(k=>`
    <div class="chip${_targetDay===k?' active':''}" id="dc2-${k}" onclick="pickDay('${k}')">${WLABELS[k].slice(0,3)}</div>`).join('');
  _pendingDay=_targetDay||null;
  openModal('modal-add');
}
function pickDay(k){
  _pendingDay=k;
  document.querySelectorAll('#day-chips .chip').forEach(c=>c.classList.remove('active'));
  document.getElementById('dc2-'+k).classList.add('active');
}
function confirmAdd(){
  if(!_pendingDay){alert('Pick a day first!');return;}
  const sets=parseInt(document.getElementById('inp-sets').value)||3;
  const reps=parseInt(document.getElementById('inp-reps').value)||10;
  const rest=parseInt(document.getElementById('inp-rest').value)||60;
  const e=EX.find(x=>x.id===_pendingEx);
  if(!S.weekPlan[_pendingDay])S.weekPlan[_pendingDay]={name:e.muscle+' Day',exercises:[]};
  S.weekPlan[_pendingDay].exercises.push({exId:_pendingEx,sets,reps,rest});
  saveS();
  closeModal('modal-add');
  if(_targetDay){
    _targetDay=null;
    showScreen('week');
    setTimeout(()=>{const c=document.getElementById('dc-'+_pendingDay);if(c){c.classList.add('open');c.scrollIntoView({behavior:'smooth'});}},100);
  }
  renderWeek();
  _pendingDay=null;_pendingEx=null;
}

// ── PLANS SCREEN ──────────────────────────────────────────
function renderPlans(){
  const list=document.getElementById('plans-list');
  document.getElementById('plans-sub').textContent=S.plans.length+' plan'+(S.plans.length!==1?'s':'')+' saved';
  if(!S.plans.length){
    list.innerHTML='<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-title">No Plans Yet</div><div class="empty-desc">Create a plan to save your weekly schedule and switch between programs.</div></div>';
    return;
  }
  list.innerHTML=S.plans.map((p,i)=>{
    const active=WKEYS.filter(k=>p.weekPlan[k]&&p.weekPlan[k].exercises.length);
    const total=WKEYS.reduce((s,k)=>s+(p.weekPlan[k]?.exercises.length||0),0);
    return `<div class="plan-card" onclick="loadPlan(${i})">
      <div class="plan-card-top">
        <div>
          <div class="plan-name">${p.name}</div>
          <div class="plan-stats">${active.length} training days · ${total} exercises ${S.activePlanId===p.id?'· <span style="color:var(--accent)">Active</span>':''}</div>
        </div>
        <button class="plan-del" onclick="event.stopPropagation();delPlan(${i})">🗑</button>
      </div>
      <div class="plan-dots">${WKEYS.map(k=>`<div class="plan-dot${active.includes(k)?' on':''}">${WSHORT[k]}</div>`).join('')}</div>
    </div>`;
  }).join('');
}
function createPlan(){
  const name=document.getElementById('new-plan-name').value.trim();
  if(!name)return;
  const p={id:Date.now().toString(),name,weekPlan:JSON.parse(JSON.stringify(S.weekPlan))};
  S.plans.push(p);S.activePlanId=p.id;saveS();
  closeModal('modal-newplan');renderPlans();updateBadge();
}
function loadPlan(i){
  const p=S.plans[i];
  S.weekPlan=JSON.parse(JSON.stringify(p.weekPlan));
  S.activePlanId=p.id;saveS();
  showScreen('week');renderWeek();updateBadge();
}
function delPlan(i){
  if(!confirm('Delete this plan?'))return;
  S.plans.splice(i,1);saveS();renderPlans();
}
function updateBadge(){
  const b=document.getElementById('active-badge');
  const p=S.plans.find(x=>x.id===S.activePlanId);
  b.textContent=p?'📋 '+p.name:'';
}

// ── WORKOUT PLAYER ────────────────────────────────────────
let P={exercises:[],exIdx:0,setIdx:0,resting:false,timer:null,restLeft:0};
function startWorkout(key){
  const w=S.weekPlan[key];if(!w||!w.exercises.length)return;
  P={exercises:w.exercises,exIdx:0,setIdx:0,resting:false,timer:null,restLeft:0};
  document.getElementById('player-day').textContent=WLABELS[key];
  renderPlayer();openModal('modal-player');
}
function renderPlayer(){
  const total=P.exercises.reduce((s,e)=>s+e.sets,0);
  const done=P.exercises.slice(0,P.exIdx).reduce((s,e)=>s+e.sets,0)+P.setIdx;
  document.getElementById('player-prog-lbl').textContent=done+'/'+total+' sets';
  document.getElementById('player-prog-bar').style.width=(total?Math.round(done/total*100):0)+'%';
  const ex=P.exercises[P.exIdx];
  const e=EX.find(x=>x.id===ex.exId);
  if(P.resting){
    document.getElementById('player-content').innerHTML=`
      <div style="text-align:center;padding:20px 0">
        <div style="font-size:40px;margin-bottom:12px">😮‍💨</div>
        <div style="font-family:'Bebas Neue',Impact,sans-serif;font-size:28px;color:var(--text2)">REST</div>
        <div class="timer-num" id="rest-num">${P.restLeft}</div>
        <div class="timer-lbl">seconds remaining</div>
        <div style="font-size:13px;color:var(--text2)">Next: ${e?.name}</div>
      </div>`;
    document.getElementById('player-next').textContent='Skip Rest →';
    document.getElementById('player-prev').style.visibility='hidden';
  } else {
    const circles=Array.from({length:ex.sets},(_,i)=>{
      let c='set-circle';
      if(i<P.setIdx)c+=' done';
      else if(i===P.setIdx)c+=' cur';
      return `<div class="${c}">${i+1}</div>`;
    }).join('');
    document.getElementById('player-content').innerHTML=`
      <div style="text-align:center;padding:10px 0">
        <div class="player-anim">${svg(e?.anim||'jump',160)}</div>
        <div class="player-ex-name">${e?.name||ex.exId}</div>
        <div class="player-info">Set ${P.setIdx+1} of ${ex.sets} · ${ex.reps} reps</div>
        <div class="set-circles">${circles}</div>
        <div style="font-size:13px;color:var(--text3)">${ex.rest}s rest between sets</div>
      </div>`;
    document.getElementById('player-next').textContent='Done Set ✓';
    document.getElementById('player-prev').style.visibility='';
  }
}
function playerNext(){
  if(P.resting){clearInterval(P.timer);P.resting=false;renderPlayer();return;}
  const ex=P.exercises[P.exIdx];
  P.setIdx++;
  if(P.setIdx>=ex.sets){
    P.exIdx++;P.setIdx=0;
    if(P.exIdx>=P.exercises.length){
      clearInterval(P.timer);
      document.getElementById('player-content').innerHTML=`<div style="text-align:center;padding:40px 0"><div style="font-size:60px;margin-bottom:16px">🏆</div><div style="font-family:'Bebas Neue',Impact,sans-serif;font-size:42px;color:var(--accent)">WORKOUT DONE!</div><div style="font-size:16px;color:var(--text2);margin-top:8px">Incredible work. Rest up.</div></div>`;
      document.getElementById('player-next').textContent='Close';
      document.getElementById('player-next').onclick=()=>closeModal('modal-player');
      document.getElementById('player-prev').style.visibility='hidden';
      document.getElementById('player-prog-bar').style.width='100%';
      return;
    }
  }
  if(ex.rest>0){
    P.resting=true;P.restLeft=ex.rest;renderPlayer();
    P.timer=setInterval(()=>{
      P.restLeft--;
      const el=document.getElementById('rest-num');
      if(el)el.textContent=P.restLeft;
      if(P.restLeft<=0){clearInterval(P.timer);P.resting=false;renderPlayer();}
    },1000);
  } else {renderPlayer();}
}
function playerPrev(){
  if(P.resting){clearInterval(P.timer);P.resting=false;}
  if(P.setIdx>0)P.setIdx--;
  else if(P.exIdx>0){P.exIdx--;P.setIdx=P.exercises[P.exIdx].sets-1;}
  renderPlayer();
}

// ── MODALS ────────────────────────────────────────────────
function openModal(id){document.getElementById(id).classList.add('open');document.body.style.overflow='hidden';}
function closeModal(id){
  document.getElementById(id).classList.remove('open');
  document.body.style.overflow='';
  if(id==='modal-player'&&P.timer)clearInterval(P.timer);
}
</script>
