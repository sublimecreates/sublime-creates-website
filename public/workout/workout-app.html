<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IronWeek">
<title>IronWeek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --surface: #141414;
  --surface2: #1e1e1e;
  --surface3: #2a2a2a;
  --accent: #e8ff47;
  --accent2: #ff6b35;
  --text: #f0f0f0;
  --text2: #888;
  --text3: #555;
  --radius: 16px;
  --safe-bottom: env(safe-area-inset-bottom, 20px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ---- NAV ---- */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0; right: 0;
  background: rgba(14,14,14,0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid #222;
  display: flex;
  padding: 10px 0 calc(10px + var(--safe-bottom));
  z-index: 100;
}
.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  background: none;
  border: none;
  color: var(--text3);
  font-family: 'DM Sans', sans-serif;
  font-size: 10px;
  font-weight: 500;
  cursor: pointer;
  transition: color 0.2s;
  padding: 4px 0;
}
.nav-btn.active { color: var(--accent); }
.nav-btn svg { width: 22px; height: 22px; }

/* ---- SCREENS ---- */
.screen {
  display: none;
  padding: 0 0 calc(80px + var(--safe-bottom));
  min-height: 100dvh;
}
.screen.active { display: block; }

/* ---- HEADER ---- */
.app-header {
  padding: 56px 20px 16px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
}
.app-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 42px;
  letter-spacing: 2px;
  color: var(--accent);
  line-height: 1;
}
.header-sub { font-size: 13px; color: var(--text2); margin-top: 2px; }

/* ---- CARDS ---- */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px;
  margin: 0 16px 12px;
}
.card-sm {
  background: var(--surface2);
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 8px;
}

/* ---- WEEK PLAN SCREEN ---- */
.week-grid {
  padding: 0 16px;
}
.day-card {
  background: var(--surface);
  border-radius: var(--radius);
  margin-bottom: 10px;
  overflow: hidden;
  border: 1px solid #1f1f1f;
  transition: border-color 0.2s;
}
.day-card.has-workout { border-color: #333; }
.day-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  cursor: pointer;
}
.day-label {
  display: flex;
  align-items: center;
  gap: 12px;
}
.day-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--text3);
}
.day-dot.active { background: var(--accent); }
.day-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 1px;
}
.day-workout-name {
  font-size: 12px;
  color: var(--text2);
  margin-top: 1px;
}
.day-chevron {
  color: var(--text3);
  transition: transform 0.2s;
}
.day-card.open .day-chevron { transform: rotate(180deg); }
.day-content {
  display: none;
  padding: 0 16px 14px;
  border-top: 1px solid #1f1f1f;
}
.day-card.open .day-content { display: block; }
.day-exercises { margin-bottom: 10px; }
.day-exercise-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid #1e1e1e;
}
.day-exercise-item:last-child { border-bottom: none; }
.exercise-mini-anim {
  width: 36px; height: 36px;
  border-radius: 8px;
  background: var(--surface3);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 18px;
}
.day-exercise-info { flex: 1; }
.day-exercise-name { font-size: 14px; font-weight: 500; }
.day-exercise-sets { font-size: 12px; color: var(--text2); margin-top: 1px; }
.remove-ex-btn {
  background: none; border: none;
  color: var(--text3); font-size: 18px; cursor: pointer;
  padding: 4px;
}
.day-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}
.btn-sm {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-accent { background: var(--accent); color: #0a0a0a; }
.btn-accent:active { transform: scale(0.97); background: #d4eb00; }
.btn-ghost { background: var(--surface3); color: var(--text2); }
.btn-ghost:active { transform: scale(0.97); }
.btn-danger { background: #2a1212; color: #ff5555; }

.rest-badge {
  text-align: center;
  padding: 10px;
  color: var(--text3);
  font-size: 13px;
  font-style: italic;
}

/* ---- EXERCISE LIBRARY ---- */
.search-bar {
  margin: 0 16px 12px;
  position: relative;
}
.search-bar input {
  width: 100%;
  background: var(--surface);
  border: 1px solid #222;
  border-radius: 12px;
  padding: 12px 16px 12px 42px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s;
}
.search-bar input:focus { border-color: var(--accent); }
.search-bar .search-icon {
  position: absolute;
  left: 14px; top: 50%;
  transform: translateY(-50%);
  color: var(--text3);
}

.filter-chips {
  display: flex;
  gap: 8px;
  padding: 0 16px 12px;
  overflow-x: auto;
  scrollbar-width: none;
}
.filter-chips::-webkit-scrollbar { display: none; }
.chip {
  white-space: nowrap;
  padding: 7px 14px;
  border-radius: 20px;
  border: 1px solid #333;
  background: var(--surface);
  color: var(--text2);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
  flex-shrink: 0;
}
.chip.active { background: var(--accent); color: #0a0a0a; border-color: var(--accent); font-weight: 600; }

.exercise-list { padding: 0 16px; }
.exercise-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  border: 1px solid #1f1f1f;
  transition: border-color 0.2s, transform 0.15s;
  -webkit-user-select: none;
}
.exercise-card:active { transform: scale(0.98); border-color: var(--accent); }

/* ---- EXERCISE ANIMATIONS ---- */
.anim-box {
  width: 64px; height: 64px;
  border-radius: 12px;
  background: var(--surface2);
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.stick-figure {
  position: absolute;
  width: 100%; height: 100%;
}

/* Pushup animation */
@keyframes pushup-body {
  0%,100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(8px) rotate(2deg); }
}
@keyframes pushup-arm {
  0%,100% { transform-origin: top; transform: rotate(40deg); }
  50% { transform-origin: top; transform: rotate(70deg); }
}
.anim-pushup .body { animation: pushup-body 1.2s ease-in-out infinite; }
.anim-pushup .arm { animation: pushup-arm 1.2s ease-in-out infinite; }

/* Squat animation */
@keyframes squat-body {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(12px) scaleY(0.85); }
}
@keyframes squat-leg {
  0%,100% { transform-origin: top; transform: rotate(10deg); }
  50% { transform-origin: top; transform: rotate(55deg); }
}
.anim-squat .body { animation: squat-body 1.4s ease-in-out infinite; }
.anim-squat .leg { animation: squat-leg 1.4s ease-in-out infinite; }

/* Curl animation */
@keyframes curl-arm {
  0%,100% { transform-origin: top; transform: rotate(20deg); }
  50% { transform-origin: top; transform: rotate(-40deg); }
}
.anim-curl .arm { animation: curl-arm 1s ease-in-out infinite; }

/* Run animation */
@keyframes run-body {
  0%,100% { transform: rotate(-3deg) translateX(-2px); }
  50% { transform: rotate(3deg) translateX(2px); }
}
@keyframes run-leg1 {
  0%,100% { transform-origin: top; transform: rotate(-30deg); }
  50% { transform-origin: top; transform: rotate(50deg); }
}
@keyframes run-leg2 {
  0%,100% { transform-origin: top; transform: rotate(50deg); }
  50% { transform-origin: top; transform: rotate(-30deg); }
}
.anim-run .body { animation: run-body 0.5s ease-in-out infinite; }
.anim-run .leg1 { animation: run-leg1 0.5s ease-in-out infinite; }
.anim-run .leg2 { animation: run-leg2 0.5s ease-in-out infinite; }

/* Row animation */
@keyframes row-body {
  0%,100% { transform: translateX(0); }
  50% { transform: translateX(-6px); }
}
@keyframes row-arm {
  0%,100% { transform-origin: top; transform: rotate(60deg); }
  50% { transform-origin: top; transform: rotate(10deg); }
}
.anim-row .body { animation: row-body 1.2s ease-in-out infinite; }
.anim-row .arm { animation: row-arm 1.2s ease-in-out infinite; }

/* Overhead press animation */
@keyframes press-arm {
  0%,100% { transform-origin: top; transform: rotate(80deg); }
  50% { transform-origin: top; transform: rotate(10deg); }
}
.anim-press .arm { animation: press-arm 1.2s ease-in-out infinite; }

/* Plank animation */
@keyframes plank-pulse {
  0%,100% { transform: scaleX(1); }
  50% { transform: scaleX(1.02); }
}
.anim-plank .body { animation: plank-pulse 2s ease-in-out infinite; }

/* Deadlift animation */
@keyframes deadlift-body {
  0%,100% { transform: rotate(0deg) translateY(0); }
  50% { transform: rotate(-35deg) translateY(8px); }
}
.anim-deadlift .body { animation: deadlift-body 1.6s ease-in-out infinite; }

/* Lunge animation */
@keyframes lunge-body {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(8px); }
}
@keyframes lunge-leg1 {
  0%,100% { transform-origin: top; transform: rotate(0deg); }
  50% { transform-origin: top; transform: rotate(40deg); }
}
@keyframes lunge-leg2 {
  0%,100% { transform-origin: top; transform: rotate(0deg); }
  50% { transform-origin: top; transform: rotate(-60deg); }
}
.anim-lunge .body { animation: lunge-body 1.4s ease-in-out infinite; }
.anim-lunge .leg1 { animation: lunge-leg1 1.4s ease-in-out infinite; }
.anim-lunge .leg2 { animation: lunge-leg2 1.4s ease-in-out infinite; }

/* Pullup animation */
@keyframes pullup-body {
  0%,100% { transform: translateY(6px); }
  50% { transform: translateY(-4px); }
}
.anim-pullup .body { animation: pullup-body 1.4s ease-in-out infinite; }

/* Dip animation */
@keyframes dip-body {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(10px); }
}
.anim-dip .body { animation: dip-body 1.2s ease-in-out infinite; }

/* Crunch animation */
@keyframes crunch-upper {
  0%,100% { transform-origin: bottom; transform: rotate(0deg); }
  50% { transform-origin: bottom; transform: rotate(-35deg); }
}
.anim-crunch .upper { animation: crunch-upper 1.2s ease-in-out infinite; }

/* Jump animation */
@keyframes jump-body {
  0%,40% { transform: translateY(0); }
  60% { transform: translateY(-14px); }
  80%,100% { transform: translateY(0); }
}
.anim-jump .body { animation: jump-body 1s ease-in-out infinite; }

/* Lateral raise animation */
@keyframes lateral-arm {
  0%,100% { transform-origin: top center; transform: rotate(0deg); }
  50% { transform-origin: top center; transform: rotate(80deg); }
}
.anim-lateral .arm1 { animation: lateral-arm 1.2s ease-in-out infinite; }
.anim-lateral .arm2 { animation: lateral-arm 1.2s ease-in-out infinite reverse; }

/* Fly animation */
@keyframes fly-arm {
  0%,100% { transform-origin: top; transform: rotate(70deg); }
  50% { transform-origin: top; transform: rotate(10deg); }
}
.anim-fly .arm1 { animation: fly-arm 1.2s ease-in-out infinite; }
.anim-fly .arm2 { animation: fly-arm 1.2s ease-in-out infinite reverse; }

.exercise-info { flex: 1 }
.exercise-name { font-size: 15px; font-weight: 600; line-height: 1.2; }
.exercise-meta {
  display: flex;
  gap: 6px;
  margin-top: 6px;
  flex-wrap: wrap;
}
.exercise-tag {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--surface3);
  color: var(--text2);
  font-weight: 500;
}
.exercise-tag.muscle { background: #1a1a2e; color: #8888ff; }
.exercise-tag.equip { background: #1a2a1a; color: #66cc66; }

.add-ex-btn {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--accent);
  border: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform 0.15s;
}
.add-ex-btn:active { transform: scale(0.9); }
.add-ex-btn svg { color: #0a0a0a; }

/* ---- MY PLANS ---- */
.plans-list { padding: 0 16px; }
.plan-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  border: 1px solid #1f1f1f;
  cursor: pointer;
  transition: border-color 0.2s;
}
.plan-card:active { border-color: var(--accent); }
.plan-card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.plan-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 24px;
  letter-spacing: 1px;
}
.plan-delete {
  background: none; border: none;
  color: var(--text3); cursor: pointer; font-size: 18px; padding: 0;
}
.plan-days-preview {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}
.plan-day-dot {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--surface3);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px;
  font-weight: 700;
  color: var(--text3);
}
.plan-day-dot.active { background: var(--accent); color: #0a0a0a; }
.plan-stats { font-size: 12px; color: var(--text2); margin-top: 8px; }
.new-plan-btn {
  width: calc(100% - 32px);
  margin: 0 16px 16px;
  padding: 16px;
  border-radius: var(--radius);
  border: 2px dashed #333;
  background: none;
  color: var(--text2);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.new-plan-btn:active { border-color: var(--accent); color: var(--accent); }

/* ---- MODALS ---- */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(4px);
  z-index: 200;
  align-items: flex-end;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border-radius: 24px 24px 0 0;
  padding: 20px 20px calc(20px + var(--safe-bottom));
  width: 100%;
  max-height: 90dvh;
  overflow-y: auto;
  animation: slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.modal-handle {
  width: 36px; height: 4px;
  border-radius: 2px;
  background: #444;
  margin: 0 auto 20px;
}
.modal-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  letter-spacing: 1px;
  margin-bottom: 16px;
}
.modal-input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid #333;
  border-radius: 12px;
  padding: 14px 16px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 16px;
  outline: none;
  margin-bottom: 12px;
  transition: border-color 0.2s;
}
.modal-input:focus { border-color: var(--accent); }
.modal-btn {
  width: 100%;
  padding: 16px;
  border-radius: 12px;
  border: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
  transition: all 0.15s;
}
.modal-btn.primary { background: var(--accent); color: #0a0a0a; }
.modal-btn.primary:active { transform: scale(0.98); background: #d4eb00; }
.modal-btn.secondary { background: var(--surface3); color: var(--text2); }

/* Sets row inputs */
.sets-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
.sets-row label { font-size: 11px; color: var(--text2); display: block; margin-bottom: 4px; }

/* Exercise detail modal */
.ex-detail-anim {
  width: 120px; height: 120px;
  border-radius: 20px;
  background: var(--surface2);
  margin: 0 auto 16px;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  overflow: hidden;
}
.ex-detail-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 32px;
  letter-spacing: 1px;
  text-align: center;
  margin-bottom: 6px;
}
.ex-detail-desc {
  font-size: 14px;
  color: var(--text2);
  text-align: center;
  line-height: 1.6;
  margin-bottom: 16px;
}
.muscle-groups {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
  margin-bottom: 20px;
}

/* Active plan day banner */
.today-banner {
  margin: 0 16px 12px;
  background: linear-gradient(135deg, #1a1f00, #252e00);
  border: 1px solid #3a4a00;
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.today-label {
  font-size: 12px;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 1px;
}
.today-workout {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px;
  color: var(--accent);
  letter-spacing: 1px;
  margin-top: 2px;
}
.start-btn {
  background: var(--accent);
  color: #0a0a0a;
  border: none;
  border-radius: 10px;
  padding: 10px 16px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
}

/* Section label */
.section-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text3);
  padding: 0 16px 8px;
  margin-top: 8px;
}

/* No plans state */
.empty-state {
  text-align: center;
  padding: 60px 32px;
  color: var(--text3);
}
.empty-icon { font-size: 48px; margin-bottom: 16px; }
.empty-title { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--text2); margin-bottom: 8px; }
.empty-desc { font-size: 14px; line-height: 1.6; }

/* Log workout modal step indicator */
.step-dots {
  display: flex; gap: 6px; justify-content: center; margin-bottom: 16px;
}
.step-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--surface3);
  transition: background 0.2s, width 0.2s;
}
.step-dot.active { background: var(--accent); width: 20px; border-radius: 3px; }

/* Workout player */
.player-exercise {
  text-align: center;
  padding: 20px 0;
}
.player-ex-anim {
  width: 160px; height: 160px;
  border-radius: 24px;
  background: var(--surface2);
  margin: 0 auto 20px;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  overflow: hidden;
}
.player-ex-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 36px;
  letter-spacing: 1px;
  margin-bottom: 4px;
}
.player-sets-info { font-size: 18px; color: var(--text2); }
.set-counter {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin: 20px 0;
}
.set-circle {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 2px solid #333;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700;
  color: var(--text3);
  transition: all 0.2s;
}
.set-circle.done { background: var(--accent); border-color: var(--accent); color: #0a0a0a; }
.set-circle.current { border-color: var(--accent); color: var(--accent); }

.timer-display {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 64px;
  letter-spacing: 4px;
  text-align: center;
  color: var(--accent);

// ============================================================
// NAVIGATION
// ============================================================
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.getElementById('nav-'+name).classList.add('active');
  if (name === 'week') renderWeek();
  if (name === 'library') renderLibrary();
  if (name === 'plans') renderPlans();
}

// ============================================================
// WEEK SCREEN
// ============================================================
function renderWeek() {
  const grid = document.getElementById('week-grid');
  const banner = document.getElementById('today-banner-wrap');
  banner.innerHTML = '';
  grid.innerHTML = '';

  const todayIdx = new Date().getDay(); // 0=Sun
  // Map to Mon=0..Sun=6
  const todayKey = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][todayIdx] || 'Mon';

  // Today banner
  const todayWorkout = state.weekPlan[todayKey];
  if (todayWorkout) {
    banner.innerHTML = `
      <div class="today-banner">
        <div>
          <div class="today-label">Today · ${WEEK_LABELS[todayKey]}</div>
          <div class="today-workout">${todayWorkout.name || 'Workout'}</div>
          <div style="font-size:12px;color:var(--text2);margin-top:2px;">${todayWorkout.exercises.length} exercise${todayWorkout.exercises.length!==1?'s':''}</div>
        </div>
        <button class="start-btn" onclick="startWorkout('${todayKey}')">▶ START</button>
      </div>`;
  }

  WEEK_KEYS.forEach(key => {
    const workout = state.weekPlan[key];
    const isToday = key === todayKey;
    const card = document.createElement('div');
    card.className = 'day-card' + (workout ? ' has-workout' : '');
    card.id = 'day-card-'+key;

    const exerciseListHTML = workout && workout.exercises.length > 0
      ? workout.exercises.map((ex,i) => {
          const exData = EXERCISES.find(e => e.id === ex.exId);
          return `<div class="day-exercise-item">
            <div class="exercise-mini-anim">${getAnimSVG(exData?.anim||'jump', 36)}</div>
            <div class="day-exercise-info">
              <div class="day-exercise-name">${exData?.name||ex.exId}</div>
              <div class="day-exercise-sets">${ex.sets} sets × ${ex.reps} reps · ${ex.rest}s rest</div>
            </div>
            <button class="remove-ex-btn" onclick="removeExerciseFromDay('${key}',${i})">×</button>
          </div>`;
        }).join('')
      : (workout ? '<div style="color:var(--text3);font-size:13px;padding:8px 0;">No exercises yet. Add some!</div>' : '');

    card.innerHTML = `
      <div class="day-header" onclick="toggleDay('${key}')">
        <div class="day-label">
          <div class="day-dot ${isToday?'active':''}"></div>
          <div>
            <div class="day-name">${WEEK_LABELS[key]}</div>
            <div class="day-workout-name">${workout ? (workout.name || 'Custom Workout') + ' · ' + workout.exercises.length + ' exercises' : 'Rest Day'}</div>
          </div>
        </div>
        <svg class="day-chevron" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="day-content">
        ${workout ? `<div class="day-exercises">${exerciseListHTML}</div>
          <div class="day-actions">
            <button class="btn-sm btn-accent" onclick="openLibraryForDay('${key}')">+ Add Exercise</button>
            ${workout.exercises.length>0?`<button class="btn-sm btn-ghost" onclick="startWorkout('${key}')">▶ Start</button>`:''}
            <button class="btn-sm btn-danger" onclick="clearDay('${key}')">Clear</button>
          </div>` :
          `<div class="rest-badge">😴 Rest & Recover</div>
          <div class="day-actions">
            <button class="btn-sm btn-accent" style="flex:1" onclick="openLibraryForDay('${key}')">+ Add Workout</button>
          </div>`
        }
      </div>`;
    grid.appendChild(card);
  });
}

function toggleDay(key) {
  const card = document.getElementById('day-card-'+key);
  card.classList.toggle('open');
}

function clearDay(key) {
  if (confirm('Remove all exercises from ' + WEEK_LABELS[key] + '?')) {
    state.weekPlan[key] = null;
    saveState();
    renderWeek();
  }
}

function removeExerciseFromDay(key, idx) {
  state.weekPlan[key].exercises.splice(idx, 1);
  if (state.weekPlan[key].exercises.length === 0) {
    // keep day but empty
  }
  saveState();
  renderWeek();
  // re-open
  setTimeout(() => {
    const card = document.getElementById('day-card-'+key);
    if (card) card.classList.add('open');
  }, 50);
}

// ============================================================
// LIBRARY SCREEN
// ============================================================
let activeFilter = 'All';
let pendingExercise = null;
let pendingDay = null;
let libraryTargetDay = null;

function renderLibrary() {
  // Chips
  const chipsEl = document.getElementById('muscle-chips');
  chipsEl.innerHTML = MUSCLES.map(m =>
    `<div class="chip ${m===activeFilter?'active':''}" onclick="setFilter('${m}')">${m}</div>`
  ).join('');
  filterLibrary();
}

function setFilter(muscle) {
  activeFilter = muscle;
  renderLibrary();
}

function filterLibrary() {
  const q = document.getElementById('lib-search').value.toLowerCase();
  const list = document.getElementById('exercise-list');
  const filtered = EXERCISES.filter(ex => {
    const matchMuscle = activeFilter === 'All' || ex.muscle === activeFilter;
    const matchSearch = !q || ex.name.toLowerCase().includes(q) || ex.muscle.toLowerCase().includes(q) || ex.equipment.toLowerCase().includes(q);
    return matchMuscle && matchSearch;
  });

  list.innerHTML = filtered.map(ex => `
    <div class="exercise-card" onclick="openExDetail('${ex.id}')">
      <div class="anim-box">${getAnimSVG(ex.anim, 64)}</div>
      <div class="exercise-info">
        <div class="exercise-name">${ex.name}</div>
        <div class="exercise-meta">
          <span class="exercise-tag muscle">${ex.muscle}</span>
          <span class="exercise-tag equip">${ex.equipment}</span>
        </div>
      </div>
      <button class="add-ex-btn" onclick="event.stopPropagation();openAddToDay('${ex.id}')">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  `).join('');

  if (!filtered.length) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">No Exercises Found</div><div class="empty-desc">Try a different search or filter.</div></div>';
  }
}

function openLibraryForDay(key) {
  libraryTargetDay = key;
  showScreen('library');
}

// ============================================================
// EXERCISE DETAIL MODAL
// ============================================================
function openExDetail(exId) {
  const ex = EXERCISES.find(e => e.id === exId);
  if (!ex) return;
  document.getElementById('ex-detail-anim-wrap').innerHTML = getAnimSVG(ex.anim, 120);
  document.getElementById('ex-detail-name').textContent = ex.name;
  document.getElementById('ex-detail-desc').textContent = ex.desc;
  document.getElementById('ex-detail-muscles').innerHTML = ex.muscles.map(m => `<span class="exercise-tag muscle">${m}</span>`).join('');
  const addBtn = document.getElementById('ex-detail-add-btn');
  addBtn.onclick = () => { closeModal('modal-ex-detail'); openAddToDay(exId); };
  openModal('modal-ex-detail');
}

// ============================================================
// ADD TO DAY MODAL
// ============================================================
function openAddToDay(exId) {
  pendingExercise = exId;
  const ex = EXERCISES.find(e => e.id === exId);
  document.getElementById('modal-ex-name-title').textContent = 'Add: ' + ex.name;
  document.getElementById('modal-ex-anim-preview').innerHTML = getAnimSVG(ex.anim, 80);
  document.getElementById('modal-ex-muscles').textContent = ex.muscles.join(' · ');

  // Day selector
  const ds = document.getElementById('day-selector');
  ds.innerHTML = WEEK_KEYS.map(key => {
    const isSelected = libraryTargetDay === key;
    return `<div class="chip ${isSelected?'active':''}" id="day-chip-${key}" onclick="selectDayChip('${key}')">${WEEK_LABELS[key].slice(0,3)}</div>`;
  }).join('');

  if (libraryTargetDay) pendingDay = libraryTargetDay;
  openModal('modal-add-to-day');
}

function selectDayChip(key) {
  pendingDay = key;
  document.querySelectorAll('#day-selector .chip').forEach(c => c.classList.remove('active'));
  document.getElementById('day-chip-'+key).classList.add('active');
}

function confirmAddExercise() {
  if (!pendingDay) { alert('Please select a day first!'); return; }
  if (!pendingExercise) return;

  const sets = parseInt(document.getElementById('inp-sets').value) || 3;
  const reps = parseInt(document.getElementById('inp-reps').value) || 10;
  const rest = parseInt(document.getElementById('inp-rest').value) || 60;
  const ex = EXERCISES.find(e => e.id === pendingExercise);

  if (!state.weekPlan[pendingDay]) {
    state.weekPlan[pendingDay] = { name: ex.muscle + ' Day', exercises: [] };
  }
  state.weekPlan[pendingDay].exercises.push({ exId: pendingExercise, sets, reps, rest });
  saveState();
  closeModal('modal-add-to-day');

  // If came from week screen, go back
  if (libraryTargetDay) {
    libraryTargetDay = null;
    showScreen('week');
    setTimeout(() => {
      const card = document.getElementById('day-card-'+pendingDay);
      if (card) { card.classList.add('open'); card.scrollIntoView({behavior:'smooth'}); }
    }, 100);
  }
  pendingDay = null;
  pendingExercise = null;
}

// ============================================================
// PLANS SCREEN
// ============================================================
function renderPlans() {
  const list = document.getElementById('plans-list');
  const label = document.getElementById('plans-count-label');
  label.textContent = state.plans.length + ' plan' + (state.plans.length!==1?'s':'') + ' saved';

  if (state.plans.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-title">No Plans Yet</div><div class="empty-desc">Create a plan to save your weekly schedule and switch between programs.</div></div>';
    return;
  }

  list.innerHTML = state.plans.map((plan, idx) => {
    const activeDays = WEEK_KEYS.filter(k => plan.weekPlan[k] && plan.weekPlan[k].exercises.length > 0);
    const totalEx = WEEK_KEYS.reduce((sum, k) => sum + (plan.weekPlan[k]?.exercises.length||0), 0);
    return `<div class="plan-card" onclick="loadPlan(${idx})">
      <div class="plan-card-header">
        <div>
          <div class="plan-name">${plan.name}</div>
          <div class="plan-stats">${activeDays.length} training days · ${totalEx} exercises total ${state.activePlanId===plan.id?'· <span style="color:var(--accent)">Active</span>':''}</div>
        </div>
        <button class="plan-delete" onclick="event.stopPropagation();deletePlan(${idx})">🗑</button>
      </div>
      <div class="plan-days-preview">
        ${WEEK_KEYS.map((k,i) => `<div class="plan-day-dot ${activeDays.includes(k)?'active':''}">${DAY_SHORT[i]}</div>`).join('')}
      </div>
    </div>`;
  }).join('');
}

function openNewPlanModal() {
  document.getElementById('new-plan-name').value = '';
  openModal('modal-new-plan');
}

function createPlan() {
  const name = document.getElementById('new-plan-name').value.trim();
  if (!name) return;

  const plan = {
    id: Date.now().toString(),
    name,
    weekPlan: JSON.parse(JSON.stringify(state.weekPlan)) // snapshot current week
  };
  state.plans.push(plan);
  state.activePlanId = plan.id;
  saveState();
  closeModal('modal-new-plan');
  renderPlans();
  // Show badge on week
  updateActivePlanBadge();
}

function loadPlan(idx) {
  const plan = state.plans[idx];
  state.weekPlan = JSON.parse(JSON.stringify(plan.weekPlan));
  state.activePlanId = plan.id;
  saveState();
  showScreen('week');
  updateActivePlanBadge();
}

function deletePlan(idx) {
  if (!confirm('Delete this plan?')) return;
  state.plans.splice(idx, 1);
  saveState();
  renderPlans();
}

function updateActivePlanBadge() {
  const badge = document.getElementById('active-plan-badge');
  if (state.activePlanId) {
    const p = state.plans.find(p => p.id === state.activePlanId);
    if (p) { badge.textContent = '📋 ' + p.name; return; }
  }
  badge.textContent = '';
}

// ============================================================
// WORKOUT PLAYER
// ============================================================
let playerState = { day: null, exercises: [], exIdx: 0, setIdx: 0, resting: false, timer: null };

function startWorkout(dayKey) {
  const workout = state.weekPlan[dayKey];
  if (!workout || !workout.exercises.length) return;

  playerState = {
    day: dayKey,
    exercises: workout.exercises,
    exIdx: 0,
    setIdx: 0,
    resting: false,
    timer: null,
    restTimeLeft: 0,
  };

  document.getElementById('player-day-name').textContent = WEEK_LABELS[dayKey];
  renderPlayer();
  openModal('modal-player');
}

function renderPlayer() {
  const ps = playerState;
  const total = ps.exercises.reduce((s,e) => s + e.sets, 0);
  const done = ps.exercises.slice(0, ps.exIdx).reduce((s,e) => s + e.sets, 0) + ps.setIdx;
  const pct = total > 0 ? Math.round((done/total)*100) : 0;

  document.getElementById('player-progress-label').textContent = `${done}/${total} sets`;
  document.getElementById('player-progress-bar').style.width = pct + '%';

  const ex = ps.exercises[ps.exIdx];
  const exData = EXERCISES.find(e => e.id === ex.exId);

  const setCircles = Array.from({length: ex.sets}, (_,i) => {
    let cls = 'set-circle';
    if (i < ps.setIdx) cls += ' done';
    else if (i === ps.setIdx) cls += ' current';
    return `<div class="${cls}">${i+1}</div>`;
  }).join('');

  if (ps.resting) {
    document.getElementById('player-content').innerHTML = `
      <div class="player-exercise">
        <div style="font-size:40px;margin-bottom:16px;">😮‍💨</div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--text2);">REST</div>
        <div class="timer-display" id="rest-timer-display">${ps.restTimeLeft}</div>
        <div class="timer-label">seconds remaining</div>
        <div style="font-size:13px;color:var(--text2);">Next: ${exData?.name}</div>
      </div>`;
    document.getElementById('player-next-btn').textContent = 'Skip Rest →';
    document.getElementById('player-prev-btn').style.display = 'none';
  } else {
    document.getElementById('player-content').innerHTML = `
      <div class="player-exercise">
        <div class="player-ex-anim">${getAnimSVG(exData?.anim||'jump', 160)}</div>
        <div class="player-ex-name">${exData?.name||ex.exId}</div>
        <div class="player-sets-info">Set ${ps.setIdx+1} of ${ex.sets} · ${ex.reps} reps</div>
        <div class="set-counter">${setCircles}</div>
        <div style="font-size:13px;color:var(--text3);">Rest: ${ex.rest}s after each set</div>
      </div>`;
    document.getElementById('player-next-btn').textContent = 'Done Set ✓';
    document.getElementById('player-prev-btn').style.display = '';
  }
}

function playerNext() {
  const ps = playerState;
  if (ps.resting) {
    // Skip rest
    clearInterval(ps.timer);
    ps.resting = false;
    renderPlayer();
    return;
  }

  const ex = ps.exercises[ps.exIdx];
  ps.setIdx++;

  if (ps.setIdx >= ex.sets) {
    // Move to next exercise
    ps.exIdx++;
    ps.setIdx = 0;
    if (ps.exIdx >= ps.exercises.length) {
      // Workout complete!
      clearInterval(ps.timer);
      document.getElementById('player-content').innerHTML = `
        <div style="text-align:center;padding:40px 0;">
          <div style="font-size:60px;margin-bottom:20px;">🏆</div>
          <div style="font-family:'Bebas Neue',sans-serif;font-size:42px;color:var(--accent);">WORKOUT DONE!</div>
          <div style="font-size:16px;color:var(--text2);margin-top:8px;">Incredible work. Rest and recover.</div>
        </div>`;
      document.getElementById('player-next-btn').textContent = 'Close';
      document.getElementById('player-next-btn').onclick = () => closeModal('modal-player');
      document.getElementById('player-prev-btn').style.display = 'none';
      document.getElementById('player-progress-bar').style.width = '100%';
      return;
    }
  }

  // Start rest timer
  if (ex.rest > 0) {
    ps.resting = true;
    ps.restTimeLeft = ex.rest;
    renderPlayer();
    ps.timer = setInterval(() => {
      ps.restTimeLeft--;
      const el = document.getElementById('rest-timer-display');
      if (el) el.textContent = ps.restTimeLeft;
      if (ps.restTimeLeft <= 0) {
        clearInterval(ps.timer);
        ps.resting = false;
        renderPlayer();
      }
    }, 1000);
  } else {
    renderPlayer();
  }
}

function playerPrev() {
  const ps = playerState;
  if (ps.resting) { clearInterval(ps.timer); ps.resting = false; }
  if (ps.setIdx > 0) { ps.setIdx--; }
  else if (ps.exIdx > 0) { ps.exIdx--; ps.setIdx = ps.exercises[ps.exIdx].sets - 1; }
  renderPlayer();
}

// ============================================================
// MODAL HELPERS
// ============================================================
function openModal(id) {
  document.getElementById(id).classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
  document.body.style.overflow = '';
  if (id === 'modal-player' && playerState.timer) {
    clearInterval(playerState.timer);
  }
}
// Close on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) closeModal(overlay.id);
  });
});

// ============================================================
// INIT
// ============================================================
updateActivePlanBadge();
renderWeek();
renderLibrary();
</script>
